<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>SP3FCK — QSO map (embed)</title>
  <meta name="description" content="Map-only version of the SP3FCK QSO map, embedded on the home page.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/ham-map.css?v=20261027">
  <style>
    /* Sama mapa: wypełnia całą ramkę (iframe na stronie głównej), bez filtrów i statystyk. */
    html, body { height: 100%; }
    body.map-only { background: #060c11; overflow: hidden; }
    .map-only .map-panel { height: 100%; display: flex; flex-direction: column; border: 0; border-radius: 0; box-shadow: none; padding: .6rem; background: var(--bg); }
    .map-only #map { flex: 1; height: auto; min-height: 0; }
    .map-only .map-toolbar { margin-bottom: .5rem; }
  </style>
</head>
<body class="map-only embed-mode">
  <section class="map-panel">
    <div class="map-toolbar">
      <div class="segmented" role="group" aria-label="Map projection">
        <button type="button" data-projection="globe" class="active">Globe</button>
        <button type="button" data-projection="azimuthal">Azimuthal</button>
        <button type="button" data-projection="flat">Flat</button>
      </div>
      <div class="layer-toggles" role="group" aria-label="Map layers">
        <label class="chip"><input type="checkbox" data-layer="cq"> CQ zones</label>
        <label class="chip"><input type="checkbox" data-layer="night"> Grayline</label>
      </div>
      <button type="button" id="resetView" class="btn ghost small">Reset view</button>
    </div>
    <div id="map" class="globe-map" aria-label="Contacts map">
      <div id="mapTooltip" class="map-tooltip" hidden></div>
      <div id="mapLegend" class="map-legend"></div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="data/dxcc-entities.js?v=20261027"></script>
  <script src="data/cq-zones.js?v=20261027"></script>
  <script src="data/itu-zones.js?v=20261027"></script>
  <script src="data/qso.latest.js"></script>
  <script src="assets/js/ham-map.js?v=20261027" defer></script>
</body>
</html>
